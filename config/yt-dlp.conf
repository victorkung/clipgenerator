# yt-dlp defaults for this repo.
# Invoked via scripts/download.sh (cwd = repo root).

# Readable, unique filenames under videos/ (quotes required: spaces in template)
-o "videos/%(uploader)s - %(title).200B [%(id)s].%(ext)s"

# Prefer native H.264 ≥1080 first (avoids re-encode). Then any ≥1080, then best.
# scripts/download.sh ALWAYS runs to-h264.sh afterward so AV1/VP9 never ship as-is.
# On X, HLS H.264 (e.g. hls-2918 ~1.3GiB) is usually far smaller than progressive
# http-10368 (~4.5GiB) at the same resolution — keep preferring codec/res, not raw http.
-f "bv*[vcodec^=avc1][height>=1080]+ba[ext=m4a]/bv*[height>=1080]+ba/b[height>=1080]/bv*+ba/b"

# Prefer higher resolution, then H.264, then mp4/m4a containers
-S res,vcodec:h264,ext:mp4:m4a

# Remux merged streams to mp4 when possible (needs ffmpeg)
--merge-output-format mp4

# Speed: X (and many YT formats) are HLS/DASH fragments. Default concurrent-fragments
# is 1 — the main wall-clock bottleneck on long X videos. 8 is a good balance;
# raise to 16 if the CDN tolerates it, lower to 4 if you see rate-limit failures.
-N 8

# Slightly larger buffer helps high-throughput links (auto-resize stays on by default)
--buffer-size 64K

# Filenames + reliability
--no-mtime
--restrict-filenames
--retries 10
--fragment-retries 10
